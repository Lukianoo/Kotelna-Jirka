<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Panel kotelny</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg: #020617;
    --panel: #020617;
    --text: #e5e7eb;
    --muted: #94a3b8;
}
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", system-ui;
    background: #0f172a;
    color: var(--text);
}

/* HEADER */
header {
    background: var(--bg);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e293b;
}
h1 {
    margin: 0;
    font-size: 18px;
}
.time {
    font-size: 12px;
    text-align: right;
    color: var(--muted);
}

/* BUTTONS */
button {
    background: #1e293b;
    color: var(--text);
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
}

/* CONTENT */
.container {
    padding: 14px;
}
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 12px;
}
.card {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 0 20px rgba(0,0,0,.4);
}
.card h2 {
    font-size: 13px;
    margin: 0;
    color: var(--muted);
}
.value {
    font-size: 28px;
    margin-top: 6px;
}
.unit {
    font-size: 14px;
    color: var(--muted);
}

/* GRAPH */
canvas {
    margin-top: 14px;
    background: var(--panel);
    border-radius: 14px;
    padding: 10px;
}

/* MOBILE */
@media (max-width: 600px) {
    h1 { font-size: 16px; }
    .value { font-size: 24px; }
}
</style>
</head>

<body>

<header>
    <h1>🔥 Panel kotelny</h1>
    <div class="time">
        <div id="now"></div>
        <div>Aktualizace: <span id="lastUpdate">–</span></div>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
</header>

<div class="container">

<div class="cards">
    <div class="card">
        <h2>Kotel</h2>
        <div class="value"><span id="kotel">–</span><span class="unit"> °C</span></div>
    </div>

    <div class="card">
        <h2>Bojler</h2>
        <div class="value"><span id="bojler">–</span><span class="unit"> °C</span></div>
    </div>

    <div class="card">
        <h2>Venku</h2>
        <div class="value"><span id="venku">–</span><span class="unit"> °C</span></div>
    </div>

    <div class="card">
        <h2>Spotřeba 24h</h2>
        <div class="value"><span id="energie">–</span><span class="unit"> kWh</span></div>
    </div>

    <div class="card">
        <h2>COP / účinnost</h2>
        <div class="value"><span id="cop">–</span></div>
    </div>
</div>

<canvas id="chart" height="140"></canvas>

</div>

<script>
/* ==== NASTAVENÍ ==== */
const CHANNEL = 1957585;
const BOJLER_L = 120;
const C = 4.186;
const PRIKON_KOTLE_KW = 6;

/* ==== ČAS ==== */
function updateTime() {
    document.getElementById("now").innerText =
        new Date().toLocaleString("cs-CZ");
}
setInterval(updateTime, 1000);
updateTime();

/* ==== FULLSCREEN ==== */
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

/* ==== DATA ==== */
fetch(`https://api.thingspeak.com/channels/${CHANNEL}/feeds.json?results=288`)
.then(r => r.json())
.then(data => {
    const feeds = data.feeds;
    const last = feeds.at(-1);

    document.getElementById("kotel").innerText = (+last.field1).toFixed(1);
    document.getElementById("bojler").innerText = (+last.field2).toFixed(1);
    document.getElementById("venku").innerText = (+last.field3).toFixed(1);
    document.getElementById("lastUpdate").innerText =
        new Date(last.created_at).toLocaleString("cs-CZ");

    const labels = feeds.map(f => new Date(f.created_at).toLocaleTimeString("cs-CZ"));
    const bojler = feeds.map(f => +f.field2);

    /* ENERGIE */
    const dT = Math.max(bojler.at(-1) - bojler[0], 0);
    const teplo_kWh = (BOJLER_L * C * dT) / 3600;
    document.getElementById("energie").innerText = teplo_kWh.toFixed(2);

    /* COP */
    const el_kWh = PRIKON_KOTLE_KW * 24;
    const cop = teplo_kWh / el_kWh;
    document.getElementById("cop").innerText = cop.toFixed(2);

    new Chart(chart, {
        type: "line",
        data: {
            labels,
            datasets: [
                { label: "Kotel", data: feeds.map(f=>+f.field1), borderColor: "#f97316", tension:.3 },
                { label: "Bojler", data: bojler, borderColor: "#38bdf8", tension:.3 },
                { label: "Venku", data: feeds.map(f=>+f.field3), borderColor: "#22c55e", tension:.3 }
            ]
        },
        options: {
            plugins: { legend: { labels: { color: "#e5e7eb" } } },
            scales: {
                x: { ticks: { color: "#94a3b8" } },
                y: { ticks: { color: "#94a3b8" } }
            }
        }
    });
});
</script>

</body>
</html>
